[project]
name = "ai-ta"
version = "0.1.0"
description = "AI助教系统 - 辅助和监测学生学习状态，个性化调整课程内容，帮助学员从零基础到找到心仪工作"
authors = [
    {name = "Kay"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
package-mode = false
dependencies = [
    "langchain (>=1.3.13,<2.0.0)",
    "langchain-core (>=1.0)",
    "langchain-classic (>=1.0)",
    "langchain-community (>=0.4)",
    "langchain-openai (>=1.0)",
    "langchain-text-splitters (>=1.0)",
    "langgraph (>=1.0)",
    "langgraph-checkpoint (>=4.0)",
    "langgraph-prebuilt (>=1.0)",
    "openai (>=1.0)",
    "pydantic (>=2.10.6,<3.0)",
    "qdrant-client (>=1.12)",
    "redis (>=5.0,<6.0)",
    "python-dotenv (>=1.0)",
    "sqlalchemy (>=2.0)",
    "chromadb (>=0.5)",
    "gradio (>=5.0)",
    "markdown-it-py (>=3.0)",
    "tiktoken (>=0.7)",
    "rich (>=13.0)",
    "pymilvus (>=3.0.0,<4.0.0)",
    "flagembedding (>=1.4.0,<2.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)",
    "jieba (>=0.42.1,<0.43.0)",
    "milvus-lite (>=3.0,<4.0)",
    "transformers (>=4.40,<5.0)",
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "neo4j (>=6.0,<7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
